name: gate

on:
  push:
  pull_request:

jobs:
  # 不需要浏览器的那一半：构建可复现 + 块顺序 + 语法。
  # 这一半在任何 runner 上都跑得起来，也是最容易悄悄坏掉的一半。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build gate
        run: python3 tools/gate.py

  # 需要浏览器的那一半：默认路径没被污染 + 指定机位可复现。
  render:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: render gate (quick)
        run: node tools/gate.js --quick
