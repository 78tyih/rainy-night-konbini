name: gate

on:
  push:
  pull_request:

jobs:
  # 不需要浏览器的那一半：构建可复现 + 块顺序 + 语法。
  # 这一半在任何 runner 上都跑得起来，也是最容易悄悄坏掉的一半。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build gate
        run: python3 tools/gate.py

  # 需要浏览器的那一半：默认路径没被污染 + 指定机位可复现。
  render:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # runner 没有 GPU：软件渲染实测约 0.8 fps @1600×900。
      # 所以 CI 用更小的画布与更少的预热帧——确定性验的是「同一 URL 两次
      # 逐字节相同」，与画布大小无关，缩小不损失判别力，只省时间。
      - name: render gate (quick)
        run: node tools/gate.js --quick --w 800 --h 450 --t 1 --timeout 600
